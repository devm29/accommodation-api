[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
(
  /(\.venv|project_venv|staticfiles|migrations)/
)
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*", ".venv/*", "project_venv/*"]
known_first_party = ["accounts", "bnbu_backend_api", "bnbu_constants", "bnbu_core", "lease", "regulations", "rental"]
