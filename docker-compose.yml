# One command brings up Postgres, Redis, the API and a Celery worker, migrates,
# and seeds a populated demo database:
#
#     docker compose up --build
#
# The API answers on http://localhost:8131 with Swagger at /api/docs/.
# Host ports are in the 8130-8139 range so nothing collides with a local
# Postgres, Redis or dev server.

name: bnbu-backend

x-api-env: &api-env
  SECRET_KEY: local-dev-only-not-a-real-secret
  DEBUG: "True"
  ENVIRONMENT: development
  ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,api"
  DATABASE_URL: postgres://dev_user:dev_password@db:5432/dev_database
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:8130"]'
  # No OpenAI account is needed to see the product work: the demo provider
  # returns canned-but-real analysis payloads, parsed by the same code the
  # live pipeline uses. Set OPENAI_API_KEY and drop this to go live.
  LLM_PROVIDER: demo
  REGULATION_SOURCES: "curated,llm"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_database
    ports: ["8132:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d dev_database"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["8133:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *api-env
    ports: ["8131:8000"]
    entrypoint: ["/app/docker-entrypoint.sh"]
    command:
      - gunicorn
      - bnbu_backend_api.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --timeout=120
      - --access-logfile=-
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6

  worker:
    build: .
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *api-env
      # The API container already migrated, collected static and seeded.
      SEED_DEMO_DATA: "0"
      RUN_COLLECTSTATIC: "0"
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["celery", "-A", "bnbu_backend_api", "worker", "-l", "info", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A bnbu_backend_api inspect ping -d celery@$$HOSTNAME"]
      interval: 20s
      timeout: 10s
      start_period: 40s
      retries: 5

volumes:
  db-data:
